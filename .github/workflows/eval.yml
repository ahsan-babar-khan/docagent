name: AI evaluation

# Calls the real model, so it costs money: run on demand or nightly, never on every push.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"   # Mondays 03:00 UTC

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    # Needs a hosted OpenAI-compatible provider (a local Ollama is not reachable from GitHub runners).
    # Without the AI_KEY secret the eval test only prints "Skipped".
    env:
      AI_ENDPOINT: ${{ vars.AI_ENDPOINT }}
      AI_KEY: ${{ secrets.AI_KEY }}
      AI_CHAT_MODEL: ${{ vars.AI_CHAT_MODEL || 'gpt-4o-mini' }}
      AI_EMBEDDING_MODEL: ${{ vars.AI_EMBEDDING_MODEL || 'text-embedding-3-small' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Evaluate answers against Eval/questions.json
        run: dotnet test -c Release --filter "Category=Eval" --logger "console;verbosity=detailed"
      - name: Publish the results table to the job summary
        if: always()
        run: cat tests/DocAgent.Tests/bin/Release/net8.0/TestResults/eval.md >> "$GITHUB_STEP_SUMMARY" || echo "No results (key not set?)" >> "$GITHUB_STEP_SUMMARY"
